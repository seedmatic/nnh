schema-version = "1.10.0"

## flowlab dev environment.
##
##  $ flox install gum   <- puts a package in [install] below
##  $ flox search gum    <- search for a package
##  $ flox show gum      <- show all versions of a package

[install]
## Incus client. The full `incus` daemon is Linux-only in the nixpkgs/flox
## catalog, but its client sub-binary builds on both platforms via the
## `pkgs.incus.passthru.client` derivation, surfaced as `.#incus-client`.
## We REUSE rke2lab's output rather than duplicate the one-liner — this is the
## single most important line to inherit: it puts `incus` on PATH, and the
## remote to nikopol-nixos is shared operator state in ~/.config/incus (one-time
## `incus remote add nikopol https://nikopol-nixos.local:8443`), so the flowlab
## collector is just another instance in the Incus daemon rke2lab already targets.
##
## A `.flake` reference to the GitHub repo (not `path:.`) keeps manifest.lock
## portable (a commit SHA, not a dev-machine absolute path). Bump with
## `flox upgrade` / `flox update`.
incus-client.flake = "github:seedmatic/rke2lab#incus-client"
gnutar.pkg-path = "gnutar"
xz.pkg-path = "xz"

[vars]

[hook]

[profile]

[options]


[include]
## This seat INCLUDES fleet's `flake-registry` env, and nothing else from fleet. That env carries
## one hook and no packages: it puts this repo's `flake-registry.json` — or the gitignored
## `flake-registry.local.json` when one is present — into nix's GLOBAL registry slot. That is
## what lets a seedmatic input be declared as an INDIRECT id (`url = "ndh"`) and re-aimed by a
## LOCAL edit, instead of a branch named in flake.nix that can only be changed by pushing.
##
## ⓘ It is `flake-registry` and not `nix` on purpose. The hook first lived in `nix`, and
## including that env for the registry dragged eleven nix tools across two systems into a seat
## that never asked for them. A seat that included `nix` BEFORE the registry chantier wanted the
## toolchain and keeps it; this one gained it only for the registry, so it takes the registry
## alone.
##
## ⓘ The hook does nothing when the repo has no registry file, so including it is harmless
## before this repo migrates its own inputs.
##
## `.flox-envs.d/` is fleet's env tree vendored in as a git subtree, so these paths stay INSIDE
## the worktree — reaching outside it would make where this checkout lives a precondition of
## activating it. Never edit it here: edits go to fleet and come back through the
## `flox-envs-subtree-sync` procedure, which also covers the mandatory re-lock after a pull.
environments = [
    { dir = "./.flox-envs.d/flake-registry" },
]
