creation_rules:
  # Age recipients for SOPS encryption:
  # - age1stxd... : Operator key, standalone (derived from nothing, in no keys.yaml)
  # - age16ldt7... : Flux/cluster key (derived from rke2-cluster SSH key via ssh-to-age)
  #                  Obtained: ssh-to-age < ~/.local/share/ndh/ssh-keys/rke2-cluster.pub
  #                  Used by Flux in-cluster to decrypt gitops/ resources
  # Until 2026-10-10 these were age10ey0l... and age1k0tc4..., whose privates were published:
  # files encrypted before that date are readable from the public history.

  # k8s is catching only secrets based
  - path_regex: '.*\.ya?ml'
    input_type: kubernetes
    encrypted_regex: '^(data|stringData)$'
    age: >-
      age1stxdeh0t6arhdm7uhyy2jcf2qj9r9vfzkwte4jr4gj6hlpxe740seq8j82,
      age16ldt7qagykh3zt609689p69vcpugth6rhzpyyufztyws7llcp4asjpvp9j
  # other YAML documents should have a sops:encrypted comment
  - path_regex: '.*'
    encrypted_comment_regex: 'sops:encrypted'
    age: >-
      age1stxdeh0t6arhdm7uhyy2jcf2qj9r9vfzkwte4jr4gj6hlpxe740seq8j82,
      age16ldt7qagykh3zt609689p69vcpugth6rhzpyyufztyws7llcp4asjpvp9j
stores:
  json:
    indent: 2
  json_binary:
    indent: 2
  yaml:
    indent: 2
