creation_rules:
  # Age recipients for SOPS encryption:
  # - age1hlvu... : Operator key, standalone (derived from nothing, in no keys.yaml)
  # - age18xsum... : the cluster's age identity, rke2lab-cluster-age-1 (roles × keys S5), STANDALONE:
  #                  generated by `ndh-keyring cluster-age 1` into the operator's pass store, derived
  #                  from no SSH key. Used by Flux in-cluster to decrypt gitops/ resources
  # Until 2026-10-10 these were age10ey0l... and age1k0tc4..., whose privates were published:
  # files encrypted before that date are readable from the public history. The operator key was
  # then age1stxd..., replaced the same day after it was exposed in a session transcript.
  # Until 2026-10-18 the cluster key was age16ldt7..., derived from the rke2-cluster SSH key, which
  # stays an SSH user key: whoever holds its private still reads every earlier version of .secrets.

  # ONE rule. A Kubernetes rule (`.*\.ya?ml` + `data|stringData`) used to come first: it matched
  # no file of this repository, and it is the rule that, first in rke2lab, swallowed keys.yaml and
  # wrapped its private keys in a valid envelope with an EMPTY payload. A leaf is encrypted only when
  # a `# sops:encrypted` comment marks it. A Kubernetes Secret added later needs rke2lab's ANCHORED
  # rule (`(^|/)01-secret-[^/]*\.ya?ml$`, input_type kubernetes) placed before this one, plus its
  # filter in .gitattributes — never the broad rule back.
  - path_regex: '.*'
    encrypted_comment_regex: 'sops:encrypted'
    age: >-
      age1hlvu7l7kefeum8drzvc5jp0jhgsqw2h3t3a8rmzvx05lcrsmx48q2ehxsk,
      age18xsumfdy9lpvlmaxksty3m20u3gwjjg9uxhrd8upd86hv82c5dwqp3xtc9
stores:
  json:
    indent: 2
  json_binary:
    indent: 2
  yaml:
    indent: 2
